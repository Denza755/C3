#============================================================#
#                         Geodata                            #
#============================================================#

# Опции координатной сетки:
#    Это затронет загрузку и обработку всех задач искусственного интеллекта и геодаты
#    При игре в текущем месте персонажа начинает сразу же работать сетка координат и кроме этого
#    начинают выстраиваться за указанное кол-во секунд 8 соседних от персонажа сеток.
#    Включение данной опции позволит координатным сеткам всегда быть активными.
GridsAlwaysOn = True
GridNeighborTurnOnTime = 1
GridNeighborTurnOffTime = 90

#[True]Loads GeoData buffer's content into physical memory. 
#[False] Does not necessarily imply that the GeoData buffer's content is not resident in physical memory. 
ForceGeodata = True

# Опции Геодаты:  
# 0 = GeoData и PathFinding OFF (стандартно) 
# 1 = GeoData используется для проверки Line Of Sight (LOS) таргета и 
#     L2Playable движения. Вы должны положить файлы в папку data/geodata. 
#     Монстры могут ходить через стены но не агрятся. 
# 2 = Все функции геодаты включены. Включает PathFinding 
#     (нужны /data/pathnode файлы) и все игроки ходят 
#     с проверкой на геодату (нельзя ходить через стены). 
GeoData = 2

# Эти настройки управляют синхронизацией между координатами игрока в системе Клиент <--> Сервер,
# 0 - без синхронизации
# 1 - частичная синхронизация Клиент --> только Сервер
# 2 - частичная синхронизация Сервер --> только Клиент
# 3 - полная синхронизация Клиент <--> Сервер
# -1 - старая система: синхронизируется только Z-координата
CoordSynchronize = -1

# Включать только при отладке Геодаты.
AcceptGeoeditorConn = False

# -------------------------------------------------------------
# Z-Axis коректировка L2Spawns class.
# Предлагаемые значиния: Town, Monster, None, All
# Если у вас есть проблемы при spawns npc на крышах, то установите значения "Monster" или "None"
# Если у вас есть проблемы с spawns npc в подземелье, то установите значения "Town" или "None"
GeoCorrectZ = All
GeoCorrectZ ALL