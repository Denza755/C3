# Для изучения навыков требуется книга навыков
SpBookNeeded = True

# Альтернативные правила изучения навыков:
# - все классы могут изучить любые навыки
# - навыки другого класса стоят x2 SP
# - навыки другой расы стоят x2 SP
# - навыки воинов/магов стоят x3 SP
AltGameSkillLearn = False

# Включить / Выключить автоизучение скиллов.
AutoLearnSkills = False

# Использовать альтернативные формулы рейтов для навыков Sleep/Root/Stun/Dagger,
# 'none' или 'false' - обычные формулы, 'alt' - альтернативные
AltGameSkillFormulas = none

# Временной множитель для навыка
AltGameSkillHitRate = 1.

# Добавлять новому игроку при старте скилл Escape 5 Мин? (По умолчанию false)
AddSkillTeleport5MMin = True

# Хранить эффекты баффов/дебаффов и другие при выходе пользователя?
StoreSkillCooltime=True

# Проверка на дебаг других скиллов у игрока при входе в игру.
CheckSkillsOnEnter = True

