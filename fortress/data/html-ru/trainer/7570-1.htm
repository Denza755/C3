!Prefect Karukia:
Наше племя, Atuba, произошло из крови волка! Волки наши браться и охранники! Волк - наш символ уже долгое время.

Другие племена Орков имеют свои символы. Серый медведь у Hetsui, летучая мышь у Neruga, скелет у Urutu, паук у Duda-Mara, и Глаз у Gandi.
