#AutoLoot enable... True to enable, False to disable
AutoLoot = True

# If XP loss (and deleveling) is enabled, default is 'true'
Delevel = True

# Allow use Event Managers for change occupation for specified steps
# If you need change occupation only use quest for all steps then set this to 0
# Default = 1,2,3
AllowClassMasters = 1,2,3

# Alternative skill learn rules:
# - all classes can learn all skills
# - skills of another class costs x2 SP
# - skills of another race costs x2 SP
# - skills of fighters/mages costs x3 SP
AltGameSkillLearn = False

# Alternative success rate formulas for skills such Sleep/Root/Stun/Dagger ones,
# 'none' or 'false' for standart, 'alt' - for alternative and
# 'forth' - for JBF calculate (can change values without server restart)

AltGameSkillFormulas = murkt

# Alternative Freight mode. If true, freights can be withdrawed from any place.
# Also, possibility to change Freight price (in adena) for each item slot in freight.
# NOTE: AltGameFreightPrice WILL NOT change the value shown to the player, but the
# player will actually get charged for the value set in here.
AltGameFreights = False
AltGameFreightPrice = 1000

# Its big security hole.
WearTestEnabled = False

# EnableMuliplierHp of mobs HP by skills (sql db already with multiplier)
EnableRateHp = False

# Buffs don't use SpS, manaheal spells heals more with SpS if true
SavingSpS = False
ManahealSpSBonus = False

# Count kills in db?
# Warning: 3 MySQL querys on every kill
KillCounter = False

# Count dropped items in db?
# Warning: 3 MySQL querys per dropepd item
DropCounter = False

# Count crafted items in db?
# Warning: 3 MySQL querys per crafted item
CraftCounter = True

# Rebuild cast targets list over cast ended
# Default false
RebuildCastTargetsList = False

# Adds basic matherials to all monsters
AltMatherialsDrop = False

# Show droplist to players?
AltShowDroplist = True

# Max recipes in book, default 50
AltMaxRecipes = 50