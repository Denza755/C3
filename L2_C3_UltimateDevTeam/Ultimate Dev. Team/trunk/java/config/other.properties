#Количество адены у нового персонажа
StartingAdena = 500

# Скорость движения для strider и wyvern
WyvernSpeed = 100
StriderSpeed = 80

#Разрешить наставнику wyvern, расположенному в каждом замке, выращивать
# wyverns и striders из вылупившихся птенцов
AllowWyvernUpgrader = False

# Если включено, то групповые эффекты будут использоваться, меньшие
# эффекты будут отменены при использовании более сильных эффектов. Новые эффекты
# при добавлении будут отменены если используются более сильные эффекты.
# Если отключено, новые эффекты не будут отменяться, заменяя собой и
# более сильные эффекты.
CancelLesserEffect = True

# Включение агрессивности охране.
# По умолчанию False.
AllowGuards = True

# При включении будет действовать наказание за убийство низкоуровневых мобов:
# - Когда уровень игрока в 9 больше уровней моба, дроп будет разделен на 3
# - После 9-уровневого различия между игроком и мобами, шанс дропа начинает
# снижаться на 9% с каждым дополнительным уровнем. (9 уровеней = -9%; 10 уровней = -18%; ...)
# ОБРАТИТЕ ВНИМАНИЕ: Эти правила применяются и ск нормальному и к сниженному дропу
# ОБРАТИТЕ ВНИМАНИЕ: Эти правила игнорируют серверные рейты
UseDeepBlueDropRules = True

# Пределы места под инвентарь
MaximumSlotsForNoDwarf = 80
MaximumSlotsForDwarf = 100
MaximumSlotsForGMPlayer = 250

# Пределы места на складах
# Dwarfs will get bonus from lvl 60
MaximumWarehouseSlotsForDwarf = 120
MaximumWarehouseSlotsForNoDwarf = 100
MaximumWarehouseSlotsForClan = 150
MaximumFreightSlots = 20

# % регенерации от нормальной скорости регенерации
HpRegenMultiplier = 100
MpRegenMultiplier = 100
CpRegenMultiplier = 100

# % регенерации и защиты для RaidBoss и их миньонов
RaidHpRegenMultiplier = 40000
RaidMpRegenMultiplier = 40000
RaidDefenceMultiplier = 300

# Unstuck interval, в секундах, по умолчанию 300 сек.
UnstuckInterval = 300

# Защита игрока после телепортации или логина; в секундах, 0 для отключения
PlayerSpawnProtection = 0

# РАСПРЕДЕЛЕНИЕ XP В ПАРТИИ
# Первая опция может быть установлена в auto, percentage, level, none.
# With "auto method" member is cut from Exp/SP distribution when his share is lower
# then party bonus acquired for him (30% for 2 member party)
# In that case he will not receive any Exp/SP from party and is not counted for party bonus
# The second option takes effect when "percentage" method is choosen. Don't use high values for this!
# The third option takes effect when "level" method is choosen. Don't use low values for this!
# If you don't want to have a cutoff point for party members' XP distribution,
# then just set the first option to "none". Defaults are: percentage , 3.0 , 30 ; respectively.
PartyXpCutoffMethod = auto
PartyXpCutoffPercent = 3.0
PartyXpCutoffLevel = 30

# Уровни восстановления HP, MP, и CP
# Значения указываются в процентах
RespawnRestoreCP = 0
RespawnRestoreHP = 70
RespawnRestoreMP = 70

# Разрешить случайное перерождение в городах с указанием максимального смещения
# от основных координат.
RespawnRandomInTown = True
RespawnRandomMaxOffset = 50
# Максимальное количество разрешенных слотов для частных складов (покупка/продажа)
# для Гномов и других расс
# По умолчанию Гномы имеют 5 слотов для хранения, а все остальные только 4 слота
MaxPvtStoreSlotsDwarf = 5
MaxPvtStoreSlotsOther = 4

# Хранить эффекты баффов/дебаффов и другие при выходе пользователя?
StoreSkillCooltime=True

# Рента с питомцев (wyvern,strider). Можно ввести как: 111,222,333
ListPetRentNpc = 7827

# Объявлять игрокам местоположение Mammon NPCs в период Ратификации Печати.
AnnounceMammonSpawn = True

# Режим альтернативных привелегий ГМ (базируется на командных привелегиях)
AltPrivilegesAdmin = False
AltPrivilegesSecureCheck = True
AltPrivilegesDefaultLevel = 100

