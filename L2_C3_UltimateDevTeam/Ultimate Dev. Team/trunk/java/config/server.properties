# Это конфигурационный файл сервера. Здесь вы можете настроить свойства связи вашего сервера.
# Обычно требуется изменить опцию ExternalHostname на
# - 127.0.0.1 (если вы играете/тестируете сервер на локальной машине)
# - LAN IP* (если вы хотите играть с другого компьютера сети)
# - WAN IP** (если вы хотите поиграть с друзьями через интернет)
#
# * = Если вы не знаете свой LAN IP, просто нажмите "Пуск" => "Выполнить..." и "cmd" => "ipconfig"
# **= Если вы не знаете свой WAN IP, посетите http://www.whatismyip.com
# ===================================================================================================
 
# ================================================================
# Основные настройки сервера !!! ОБЯЗАТЕЛЬНО настройте под себя!!!
# ================================================================

# Укажите здесь (ip) адрес вашего Игрового Сервера,  Или используйте символ *
GameserverHostname=127.0.0.1
GameserverPort=7777

# Если ваш сервер опубликован с помощью NAT укажите здесь ваш ВНЕШНИЙ IP. Или используйте символ *
ExternalHostname=127.0.0.1

# Если ваш сервер опубликован с помощью NAT укажите здесь ваш ВНУТРЕННИЙ IP. Или используйте символ *
InternalHostname=127.0.0.1


# Укажите здесь (ip) адрес вашего Логин-Сервера,  Или используйте символ *
LoginserverHostname=127.0.0.1
LoginserverPort=2106
LoginTryBeforeBan=20

# Укажите порты Вашего Логин-сервера
LoginPort=9014
LoginHost=127.0.0.1

# Укажите идентификатор (ID) вашего сервера  (например- 0 это Bartz).
RequestServerID = 0
# Укажите (true), если ваш Логин сервер настроен на свободную выдачу идентификаторов
AcceptAlternateID = True

# Параметры Базы данных
Driver=com.mysql.jdbc.Driver
#Driver=org.hsqldb.jdbcDriver
#Driver=com.microsoft.sqlserver.jdbc.SQLServerDriver
URL=jdbc:mysql://localhost/l2jdb
#URL=jdbc:hsqldb:hsql://localhost/l2jdb
#URL=jdbc:sqlserver://localhost/database=l2jdb/user=root/password=root
Login=root
Password=root
MaximumDbConnections=10

# Укажите в какой директории находится Datapack, (по умолчанию это папка data в директории GameServer'а)
# DatapackRoot = C:/server/DataPack

# Шаблон имени персонажа
# Например, если использовать такой шаблон: CnameTemplate=[A-Z][a-z]{3,3}[A-Za-z0-9]*
# будет разрешать использовать имена с большой буквы и последующими маленькими,
# и любыми словами или цифрами, к примеру ZbigN1eW
# Наиболее рационально поставить CnameTemplate=[A-Z][a-z]*
# т.е. именя начинаются с большой и заканчиваются маленькими буквами, к примеру Zbigniew
# Default .* - можно использовать любые символы
CnameTemplate=[A-Za-z0-9]*
PetNameTemplate=[A-Za-z0-9]*

# Максимальное количество одновременно играющих игроков.
MaximumOnlineUsers=100

# =================================================================
# Настройки сервера для его отладки и тестирования
# =================================================================

Debug = False
Assert = False
Developer = False

# включение данной опции превратиш сервер в тестовый сервер
# (отобразится у клиентов с включенной опцией testserver)
TestServer = False

# =================================================================
# Дополнительные настройки сервера, рекомендуется оставить как есть
# =================================================================

# Настройки для списка серверов
# Отображать имя сервера в [] скобках
ServerListBrackets = False
# Отображать часы рядос с именем сервера
ServerListClock = False
# При включении данной опции на сервер смогут зайти только ГМы
ServerGMOnly = False

MaximumUpdateDistance = 50

# Минимальный и максимльный протокол клиента.
# по правилу MinProtocolRevision <= MaxProtocolRevision.
MinProtocolRevision = 557
MaxProtocolRevision = 660

# Контроль рейтов, плавающие значения
RateXp = 1.
RateSp = 1.
RatePartyXp = 1.
RatePartySp = 1.
RateDropAdena = 1.
RateConsumableCost = 1.
RateDropItems = 1.
RateDropSpoil = 1.
RateQuestsReward = 1
RateKarmaExpLost = 1
RateSiegeGuardsPrice = 1
RatePetExp = 1
RatePetSp = 1

# Контроль рейта дропа игрока, значения указываются в процентах
PlayerDropLimit = 3
PlayerRateDrop = 5
PlayerRateDropItem = 70
PlayerRateDropEquip = 25
PlayerRateDropEquipWeapon = 5

# Karma Drop Rate control, values are the percent values
KarmaDropLimit = 5
KarmaRateDrop = 70
KarmaRateDropItem = 50
KarmaRateDropEquip = 40
KarmaRateDropEquipWeapon = 10

# удалять сброшенные на землю предметы после n секунд. 0 - disabled
AutoDestroyDroppedItemAfter = 0

# Данная настройка это эксперементальная синхронизация между Клиентскими <-и-> Серверными координатами игрока,
#   0 - нет синхронизации ВООБЩЕ !!!
#   1 - Частичная синхронизация от клиента -к-> серверу
#   2 - Частичная синхронизация от Сервера -к-> клиенту
#   3 - Полная синхронизация Клиента <-и-> Сервера
#  -1 - Старая система синхронизации: Только по оси Z
CoordSynchronize = -1

# Если Вы испытываете проблемы со складами или фрахтом,
# смело можете их отключить. (по умолчанию оба включены).
AllowWarehouse = True
AllowFreight   = True
AllowWear      = True
#Enable water test
AllowLottery   = False
AllowRace      = False
AllowWater     = False

# Включение ренты за питомцев (wyvern&strider)
AllowRentPet   = False

# Разрешить игрокам выбрасывать вещи на землю
AllowDiscardItem = True

# При включении данной опции любой созданый персонаж будет получать уровень доступа 200.
EverybodyHasAdminRights = False

#Разрешить ботов L2Walker (по умолчанию False)
# Может быть True, False, GM
AllowL2Walker    = False
L2WalkerRevision = 552
# Банить аккаунт за использование l2walker если он не является GM, AllowL2Walker = False
AutobanL2WalkerAcc    = False

# Активация регистратора положения
# valid 3D points will be recorded and written to data/universe.txt on shutdown
ActivatePositionRecorder = False

# Настройки глобального чата - ON, OFF, GM
# Включение глобального Чата: ON-Включен, OFF-Выключен, GM-Только для GM, GLOBAL-Глобально
GlobalChat=OFF

# Вести лог окна чата
LogChat = True
LogItems = False

# Отображать в панели сообщества уровень персонажей
ShowLevelOnCommunityBoard = False
ShowStatusOnCommunityBoard = True
NamePageSizeOnCommunityBoard = 50
NamePerRowOnCommunityBoard = 5

# Настройки зон
#   0 = Мир во всем мире
#   1 = PVP при осадах
#   2 = PVP везде
ZoneTown = 0

# Настройка максимального значения отхода моба от точки появления
MaxDriftRange = 200

# Минимальная и максимальная задержка в секундах для анимации NPC
# Минимальное значение не должно быть больше Максимального
# "0" is default value.
MinNPCAnimation = 0
MaxNPCAnimation = 0

# You can choose NPC name either of client side one or server side one.
# Client side NPC name is useful for non english client.
# You can overwrite client side NPC name if you choose server side NPC name.
# Client side name is default value.
ServerSideNpcName = False
# Show L2Monster level and aggro, ServerSideNpcName must be enabled
ServerSideNpcNameWithLvl = False

AutoDeleteInvalidQuestData = False

# настройки дня\ночи
# Hours are from 0 - 23
#Солнце Всает в 
DayStatusSunRiseAt = 6
#Солнце заходит в 
DayStatusSunSetAt = 18
# Forces the client to change their day and night status
DayStatusForceClientUpdate = True

# The Size of the 3 Thread pools used for scheduled tasks
# The 3 thread pools have differant priorities (high, medium low)
# You should modify this with care, setting this too high could harm
# the server. This should be increased on multi-proc/core computers
# Default is 4, 10 and 4
ThreadPoolSizeHigh = 4
ThreadPoolSizeMed = 10
ThreadPoolSizeLow = 4

# P4(800) w. HT runs well with this
# ThreadPoolSizeHigh = 8
# ThreadPoolSizeMed = 20
# ThreadPoolSizeLow = 8

# For multi cpu's and multi core cpu's
# ThreadPoolSizeHigh = 12
# ThreadPoolSizeMed = 20
# ThreadPoolSizeLow = 16

# Удалять персонаж, выбраный для отказа, через N дней, 0 - отключение опции
DeleteCharAfterDays = 7

# Наказание персонажа за нелегальные действия
#   1 - Отправка ГМам сообщения о данном действии
#   2 - Выкинуть игрока (kick)
#   3 - Выкинуть и забанить
#   4 - Поcадить игрока в тюрьму (в следующем параметре указывается время в минутах: 0 = без ограничения )
DefaultPunish = 2

# Использовать кэширование html файлов (True or False)
# (Загружает html в кэш толко при первом запросе)
LazyCache=True

# Объединение потоков по приоритетам выполнения
# default values are -1,0,1 (группы low/med/high)
ExecutorPriLow=-1
ExecutorPriMed=0
ExecutorPriHigh=1
# Время жизни пакетов (в секундах), 0 - отключено
PacketLifeTime=0

# bypass exploit protection
BypassValidation=False
