#-------------------------------------------------------------
# Настройки сервера
#-------------------------------------------------------------
# Включение автоподбора дропа вещей с монстров.
# Впишите True для включения, False - для отключения.
# по умолчанию - включено ('False')
AutoLoot = False

# Разрешить понижение уровня персонажа при потере XP
# по умолчанию - включено ('True')
Delevel = True

# Если выключено, урон магией будет наноситься с вероятностью 100%
# по умолчанию - включено ('true')
MagicFailures = True

# Для изучения навыков требуется книга навыков
# по умолчанию - включено ('true')
SpBookNeeded = True

# Крафт вкл/выкл
# по умолчанию - включено ('true')
CraftingEnabled = True

# Вкл/выкл классмастера
# Для выключение классмастера введите 0
# Default = 1,2,3
AllowClassMasters = 1,2,3

# Правила крафта:
# - Время крафта
# - получение EXP/SP
# по умолчанию - включено ('False')
AltGameCreation = False

# Правила изучения Альтернативных навыков 
# - все классы могут изучить все навыки
# - навыки другого класса стоят x2 SP
# - навыки другой рассы стоят  x2 SP
# - навыки борцов/волшебников стоят x3 SP
# по умолчанию - включено ('False')
AltGameSkillLearn = False

# Альтернативное окончание атаки (bow, cast, all)
AltGameCancelByHit = cast

# Альтернативные правила для щитов - если удается блок щитом, то
# урон расчитывается как powerAtk-shieldDef,
# При включении расчет идет как powerAttak / (shieldDef + powerDef)
# по умолчанию - включено ('False')
AltShieldBlocks = False

# Альтернативная атака монстров, как в C1
# по умолчанию - включено ('False')
AltGameMobAttackAI = False

# Использовать альтернативные формулы рейтов для навыков Sleep/Root/Stun/Dagger,
# 'none' или 'false' - обычные формулы, 'alt' - альтернативные
AltGameSkillFormulas = none

# Альтернативный фрахт. Если включено, фрахты могут быть отправлены из любого места.
# Так же можно изменять стоимость фрахта (в аденах) для каждого слота фрахта.
# ОБРАТИТЕ ВНИМАНИЕ: AltGameFreightPrice НЕ БУДЕТ изменять цену для игрока,
# но с игрока будет взыматься стоимость, указанная здесь.
# по умолчанию - включено ('False')
AltGameFreights = False
AltGameFreightPrice = 1000

# Альтернативный расчет Xp/Sp, если не 0, тогда расчитывается как 2^((mob.level-player.level) / coef),
# Несколько примеров для "AltGameExponentXp = 5." и "AltGameExponentSp = 3."
# diff = 0 (игрок и моб имеют одинаковый уровень), XP bonus rate = 1, SP bonus rate = 1
# diff = 3 (моб на 3 уровня выше), XP bonus rate = 1.52, SP bonus rate = 2
# diff = 5 (моб на 5 уровней выше), XP bonus rate = 2, SP bonus rate = 3.17
# diff = -8 (моб на 8 уровней ниже), XP bonus rate = 0.4, SP bonus rate = 0.16
#AltGameExponentXp = 0
#AltGameExponentSp = 0
AltGameExponentXp = 0
AltGameExponentSp = 0

# Использование усталости (вместо CP)
# по умолчанию - включено ('False')
AltGameTiredness = False

# Временной множитель для навыка
AltGameSkillHitRate = 1.

# Временной множитель для HP
# по умолчанию - включено ('False')
EnableRateHp = False

# Альтернативные настройки для игрока с кармой
AltKarmaPlayerCanBeKilledInPeaceZone = False
AltKarmaPlayerCanShop = True
AltKarmaPlayerCanTeleport = True
AltKarmaPlayerCanTrade = True
AltKarmaPlayerCanUseWareHouse = True
AltKarmaPlayerCanUseGateKeeper = False

# Игрок должен быть в  замке/альянса клана чтобы участвовать в печати рассвета.
# по умолчанию - включено ('False')
AltRequireCastleForDawn = False

# Собственность замка принадлежит клану или альянсу.
# по умолчанию альянсу, согласно офф серверу.
AltRequireClanCastle = False

# Разрешить бесплатную телепортацию по всему миру
# по умолчанию - включено ('False')
AltFreeTeleporting = False

# Можно получить суб-класс без прохождения квеста?
# по умолчанию - включено ('False')
AltSubClassWithoutQuests = False

# Может ли игрок просматривать информацию об NPC?.
# по умолчанию - включено ('False')
AltGameViewNpc = False