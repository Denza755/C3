#=============================================================
#              WARNING                WARNING
#=============================================================
# Эти настройки могут изменить работу вашего сервера.
# Ваш сервер будет отличаться от стандартных серверов.
# 
# Изменение значений будет полезно если вы поддерживаете
# какой-либо специализированый или просто маленький сервер.
#=============================================================

#-------------------------------------------------------------
# Настройки сервера
#-------------------------------------------------------------
# Включение автоподбора дропа вещей с монстров.
# Впишите True для включения, False - для отключения
AutoLoot = False


# Разрешить понижение уровня персонажа при потере XP
# по умолчанию - включено ('true')
Delevel = True

# Если выключено, урон магией будет наноситься с вероятностью 100%
# по умолчанию - включено ('true')
MagicFailures = True

# Альтернативное окончание атаки (bow, cast, all)
AltGameCancelByHit = all

# Альтернативные правила для щитов - если удается блок щитом, то
# урон расчитывается как powerAtk-shieldDef,
# При включении расчет идет как powerAttak / (shieldDef + powerDef)
AltShieldBlocks = True

# Альтернативный AltGameMobAttackAI, подобие C1
AltGameMobAttackAI = False

# Включение альтернативного фрахта (стандартно False)
AltGameFreights = False

# Цена альтернативного фрахта
AltGameFreightPrice = 1000

# Альтернативный расчет Xp/Sp, если не 0, тогда расчитывается как 2^((mob.level-player.level) / coef),
# Несколько примеров для "AltGameExponentXp = 5." и "AltGameExponentSp = 3."
# diff = 0 (игрок и моб имеют одинаковый уровень), XP bonus rate = 1, SP bonus rate = 1
# diff = 3 (моб на 3 уровня выше), XP bonus rate = 1.52, SP bonus rate = 2
# diff = 5 (моб на 5 уровней выше), XP bonus rate = 2, SP bonus rate = 3.17
# diff = -8 (моб на 8 уровней ниже), XP bonus rate = 0.4, SP bonus rate = 0.16
AltGameExponentXp = 0
AltGameExponentSp = 0

# Использование усталости (вместо CP)
AltGameTiredness = False

# EnableMuliplierHp of mobs HP by skills (HIGHLY RECCOMENDED with latest npc.sql)
EnableRateHp = True

# Party range for L2Attackable (default 1600)
AltPartyRange = 1600
# Party range for L2Party (default 1400)
AltPartyRange2 = 1400

#-------------------------------------------------------------
# Альтернативные настройки для игроков с кармой
#-------------------------------------------------------------

# Игрок с кармой может быть убит в городе?
AltKarmaPlayerCanBeKilledInPeaceZone = False

# Игрок с кармой может делать покупки?
AltKarmaPlayerCanShop = True

# Игрок с кармой может использовать Свиток или Навык Возврата?
AltKarmaPlayerCanTeleport = True

# Игрок с кармой может использовать гейткиперов (GK)?
AltKarmaPlayerCanUseGK = False

# Игрок с кармой может торговать?
AltKarmaPlayerCanTrade = True

# Игрок с кармой может использовать склад?
AltKarmaPlayerCanUseWareHouse = True

# Разрешить свободную телепортацию по всему миру.
AltFreeTeleporting = False

# # Allow player sub-class addition without checking for unique quest items.
AltSubClassWithoutQuests = False

# Могут ли игроки просматривать дроп с монстров? 
AltGameViewNpc = False

# Я хз чо это oO
AltNewCharAlwaysIsNewbie = False

#-------------------------------------------------------------
# Настройки крафтинга
#-------------------------------------------------------------
# Крафтинг включен/выключен. По умолчанию - включен
CraftingEnabled = True

# Максимальное количество рецептов в книге рецептов
# Лимит рецептов для гномов (стандартно 50)
DwarfRecipeLimit = 50

# Альтернативные правила крафтинга:
# - изготовление занимает какое-то время
# - игроки получают EXP/SP за крафтинг
AltGameCreation = False

# Временной множитель - большее число дает более медленное изготовление
# но большее количество XP/SP 
AltGameCreationSpeed = 1

# Дополнительный множитель XP/SP (для увеличения XP/SP)  по умолчанию = 1
AltGameCreationRateXp = 1
AltGameCreationRateSp = 1

# Установка Class Master на сервере. Стандартно = False
AllowClassMasters = False

#============================================================#
#                       Настройки клана                      #
#============================================================#

# Количество дней для входа в другой клан
DaysBeforeJoinAClan = 5
# Количество дней для создания нового клана
DaysBeforeCreateAClan = 10

# Количество членов клана, требуемых для начала клановой войны
AltClanMembersForWar = 15

# Все новые персонажи на одном аккаунте будут помечены как новички, а не только самый первый
AltNewCharAlwaysIsNewbie = False

#============================================================#
#                           Манор                            #
#============================================================#

# Время обновления манора.
# Стандартно:  8 часов вечера (20) 
AltRefreshTime = 20

# Время обновления манора в минутах.
# Стандартно:  00.
AltManorRefreshMin = 00

# Время подтверждения манора.
# Стандартно:  в 6 часов утра 
AltManorApproveTime = 6

# Время подтверждения манора в минутах.
# Стандартно:  00
AltManorApproveMin = 00

# Перерыв.
# Стандартно: 6 минут.
AltManorMaintenancePeriod = 360000

# Способ сохранения. True - сохранять в базу после каждого действия.
# Стандартно: True
AltManorSaveAllActions = True

# Сохранение статуса манора(если только AltManorSaveAllActions=false).
# Стандартно: каждые 2 часа
AltManorSavePeriodRate = 2

#============================================================#
#                     Настройки лотереи                      #
#============================================================#
# Начальный приз лотереи
AltLotteryPrize = 50000

# Цена лотерейного билета
AltLotteryTicketPrice = 2000

# Какую часть призового выигрыша должны получить участники лотереи, угадавшие 5 выигрышных номеров
AltLottery5NumberRate = 0.6

# Какую часть призового выигрыша должны получить участники лотереи, угадавшие 4 выигрышных номера
AltLottery4NumberRate = 0.2

# Какую часть призового выигрыша должны получить участники лотереи, угадавшие 3 выигрышных номера
AltLottery3NumberRate = 0.2

# Сколько аден получают участники, угадавшие два и меньше выигрышных номера
AltLottery2and1NumberPrize = 200

# Вы не можете летать на виверне в зоне Эпик рейдов. Или можете - True
DontEpicFly = False

# Все мобы спавнятся в двойном количестве
DoubleSpawn = False
