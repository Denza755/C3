# Цвета для использования в имени Админа. (уровень доступа 100+).
# (Может быть использован формат BGR: к примеру 00FF00 = Green)
AdminNameColor = 00FF00
# Цвета для использования в имени ГМа. (уровень доступа 75+).
# (Может быть использован формат BGR: к примеру FFFF00 = Yellow)
