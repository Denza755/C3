MaximumWarehouseSlotsForDwarf = 120
# Максимальное кол-во слотов у игроков
MaximumWarehouseSlotsForNoDwarf = 100
# Максимальное кол-во слотов в клановом хранилище
MaximumWarehouseSlotsForClan = 200
# Максимальное кол-во слотов при фрахте
MaximumFreightSlots = 20

# % регенерации от нормальной скорости регенерации игроков
HpRegenMultiplier = 100
MpRegenMultiplier = 100
CpRegenMultiplier = 100

# % регенерации и защиты для RaidBoss и их миньонов
RaidHpRegenMultiplier = 100
RaidMpRegenMultiplier = 100
RaidDefenceMultiplier = 300

# Защита игрока после телепортации или логина; в секундах, 0 для отключения
PlayerSpawnProtection = 0

# Список итемов, которые нельзя выкидывать на землю.
ListOfNonDroppableItems = 1147,425,1146,461,10,2368,7,6,2370,2369,5598

# РАСПРЕДЕЛЕНИЕ XP В ПАРТИИ
# Первая опция может быть установлена в auto, percentage, level, none.
# Когда стоит "auto" член партии получает меньше Exp/SP, когда его  уровень низкий
# тогда бонус партии полученная за него (30% для 2 членов партии)
# В таком случае он не получит  Exp/SP от партии, и не будет получать партийный бонус
# Не ставте слишком высокие значения параметра "percentage"!
# Не ставте слишком низкие значения параметра "level"!
# Если вы не хотите, чтобы было распределение ХР для членов партии
# просто поставьте "none". По умолчанию: , 3.0 , 30
PartyXpCutoffMethod = auto
PartyXpCutoffPercent = 3.0
PartyXpCutoffLevel = 30

# Уровни восстановления HP, MP, и CP
# Значения указываются в процентах
RespawnRestoreCP = 0
RespawnRestoreHP = 70
RespawnRestoreMP = 70

# Разрешить случайное перерождение в городах с указанием максимального смещения
# от основных координат.
RespawnRandomInTown = False
# Максимальное отклонение от точки спавна
RespawnRandomMaxOffset = 50

# Максимальное количество разрешенных слотов для частных складов (покупка/продажа)
# для дварфов и других расс
# По умолчанию дварфы имеют 5 слотов для хранения, а все остальные только 4 слота
MaxPvtStoreSlotsDwarf = 5
MaxPvtStoreSlotsOther = 4

# Рента с питомцев (wyvern,strider). Можно ввести как: 111,222,333
ListPetRentNpc = 7827

# Объявлять игрокам местоположение Mammon NPCs в период Ратификации Печати.
AnnounceMammonSpawn = True

# Режим альтернативных привелегий ГМ (базируется на командных привелегиях)
