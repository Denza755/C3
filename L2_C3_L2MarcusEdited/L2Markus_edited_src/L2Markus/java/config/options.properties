# =================================================================
# Настройки сервера для его отладки и тестирования
# =================================================================

Debug = False
Assert = False
Developer = False

# включение данной опции превращает сервер в тестовый сервер
# (отобразится у клиентов с включенной опцией testserver)
TestServer = False

# =================================================================
# Дополнительные настройки сервера, рекомендуется оставить как есть
# =================================================================

# При включении данной опции любой созданый персонаж будет получать уровень 200.
EverybodyHasAdminRights = False

# Настройки для списка серверов
# Отображать имя сервера в [] скобках
ServerListBrackets = True

# Отображать часы рядос с именем сервера
ServerListClock = True

# При включении данной опции на сервер смогут зайти только ГМы
ServerGMOnly = False

# Настройки зон
#   0 = Мир во всем мире
#   1 = PVP при осадах
#   2 = PVP везде
ZoneTown = 0

# Наказание персонажа за нелегальные действия
#   1 - Отправка ГМам сообщения о данном действии
#   2 - Выкинуть игрока (kick)
#   3 - Выкинуть и забанить
#   4 - Поcадить игрока в тюрьму

# Стандартное наказание
DefaultPunish = 2

# Время действия стандартного наказания (0 = навсегда)
DefaultPunishParam = 0

# Обход взлома защиты
BypassValidation = False

# Использование gameguard для проверки клиента
# GameGuardEnforce - использует запрос gameguard про входе персонажа в игру
# GameGuardProhibitAction - не разрешит игроку заниматься торговлей, разговаривать с npc
# и передвигаться до получения ответа от gameguard
GameGuardEnforce = False
GameGuardProhibitAction = False

# Day/Night Status
# Hours are from 0 - 23
DayStatusSunRiseAt = 6
DayStatusSunSetAt = 18
# Forces the client to change their day and night status
DayStatusForceClientUpdate = True

# Удалять персонаж, выбраный для отказа, через N дней, 0 - отключение опции
DeleteCharAfterDays = 5


# =================================================================
# Server optimisations
# =================================================================
# set the initial size of the flood protector (should equal ~player count)
FloodProtectorInitialSize = 50
# Удалять сброшенные на землю вещи через N секунд. 0 - отключить
AutoDestroyDroppedItemAfter = 0
# Удалять испорченые квесты у игрока
AutoDeleteInvalidQuestData = True
# Установка в false может улучшить работу серверов с высокими рейтами
PreciseDropCalculation = True
# разрешить создавать нестыкуемые вещи  
MultipleItemDrop = True

# Пересылает информацию обо всех вещах персонажа, а не только о той с которой происходит операция.
# ОБРАТИТЕ ВНИМАНИЕ: Неимоверно нагружает трафик. 
ForceInventoryUpdate = True

# Использовать кэширование html файлов (True or False)
# (Загружает html в кэш толко при первом запросе)
LazyCache = True

# Максимальное отклонение моба от точки спауна
MaxDriftRange = 100

# Максимальное отклонение пета от хозяина
MaxDriftRangePet = 100

# Минимальная и максимальная задержка в секундах для анимации NPC
# Минимальное значение не должно быть больше Максимального
# "0" is default value.
MinNPCAnimation = 110
MaxNPCAnimation = 130

# Включить хождение НПЦ в деревне людей и гномов
# а также гуляние петов вокруг НПЦ Петменеджеров
WalkNpc = True

# Отображать уровень и агрессивность монстров
ShowNpcLevel = False

# Включить запись положения.
# Во время выключения данные будут сохранены в data/universe.txt
ActivatePositionRecorder = False


# =================================================================
# Дополнительные возможности
# =================================================================
# Если Вы испытываете проблемы со складами или фрахтом,
# смело можете их отключить. (по умолчанию оба включены).

# Разрешить кеширование Warehouse
# если WH не будет использоваться, то память используемая под WH будет свободной
AllowWarehouse   = True
AllowFreight     = True

# Разрешить игроку примерку оружия и брони в магазинах
# Задается стоимость примерки каждой вещи
AllowWear        = True
WearDelay        = 10
WearPrice        = 10

# Включение Лотереи
AllowLottery     = False

# Включение Расс
AllowRace        = True

# Включение воды
AllowWater       = True

# Включение манора
AllowManor       = True

# Включение ренты за питомцев (wyvern и strider)
AllowRentPet     = False

# Разрешить выбрасывать вещи на землю?
AllowDiscardItem = True

# Разрешить корабли
AllowBoat        = True

# Разрешить ботов L2Walker (по умолчанию False)
# Может быть True, False, GM (только для ГМов)
AllowL2Walker      = False
# Разрешённая версия бота
L2WalkerRevision   = 552

# Банить аккаунт за использование l2walker если он не является GM, AllowL2Walker = False
AutobanL2WalkerAcc = True


# =================================================================
# Опции ведения лог-файлов
# =================================================================

# Ведение лога всех предметов персонажа
# ОБРАТИТЕ ВНИМАНИЕ: при включении может создать неимоверную нагрузку на сервер.
LogItems = True

# Лог действий GM
GMAudit = True

# -------------------------------
#  Community board -
# -------------------------------
# Panel Type Community
# - Full = new panel
# - Old = old panel
# - Off = off
CommunityType = Full
BBSDefault = _bbshome

# Displayed in the community level characters
ShowLevelOnCommunityBoard = False
ShowStatusOnCommunityBoard = True
NamePageSizeOnCommunityBoard = 50
NamePerRowOnCommunityBoard = 5


# =================================================================
# Управление потоками - хорошая настройка снизит нагрузку на сервер
# =================================================================

ThreadPoolSizeEffects = 10
ThreadPoolSizeGeneral = 13

# Стандарт 2
UrgentPacketThreadCoreSize = 2

# Стандарт 4
GeneralPacketThreadCoreSize = 4

# Стандарт 4
GeneralThreadCoreSize = 4

AiMaxThread = 6


# Объединение потоков по приоритетам выполнения
# стандартные значения -1,0,1 (группы low/med/high)
ExecutorPriLow = -1
ExecutorPriMed = 0
ExecutorPriHigh = 1

# Время жизни пакетов (в секундах), 0 - отключено
PacketLifeTime = 0
