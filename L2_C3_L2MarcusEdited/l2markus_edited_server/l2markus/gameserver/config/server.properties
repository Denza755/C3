#Driver=com.microsoft.sqlserver.jdbc.SQLServerDriver
URL=jdbc:mysql://localhost/l2markus_db
#URL=jdbc:hsqldb:hsql://localhost/x15
#URL=jdbc:sqlserver://localhost/database=x15/user=root/password=root
Login=root
Password=k1araukarlaukralak0ral
