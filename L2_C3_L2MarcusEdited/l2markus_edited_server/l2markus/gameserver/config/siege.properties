# Файл быстрой настройки осад, недопускаются пробелы в значениях.
# Награда дается каждые 2 часа всем клановым складам и владельцу замка

# Обратный отсчет длительности осады (в минутах)
SiegeLength=120

# Дискретность обратного отсчета, лучше использовать кратное 5 (в минутах)
CountDownLength=10

# Максимальное количество флагов для клана
MaxFlags=1

# Минимальный уровень для регистрации
SiegeClanMinLevel=4

# Максимальное кол-во кланов, которые могут зарегистрироваться с каждой стороны
AttackerMaxClans=500
DefenderMaxClans=500

# Время респауна в мсек
# респаун защитников
DefenderRespawn=20000
# респаун атакующих
AttackerRespawn=0

# Штрафное время респауна для каждой контрольной башни
CTLossPenalty=20000

# Спавн Caste Artefacts и Control Towers
#
# Синтаксис Control Towers:  NameControlTowerN=x,y,z,npc_id,hp
# Name - Название замка
# N - номер
# x,y,z - координаты
# npc_id - id и template
# hp - максимум жизней
#
# Синтаксис Artefacts:  NameArtefactN=x,y,z,heading,npc_id
# Name - Название замка
# N - номер
# x,y,z - координаты
# heading
# npc_id - id и template

